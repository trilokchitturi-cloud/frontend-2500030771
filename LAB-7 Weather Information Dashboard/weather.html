<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .dashboard { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; text-align: center; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
        #weather-info { margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>Weather Dashboard</h2>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
        <div id="weather-info"></div>
    </div>

    <script src="weather.js"></script>
</body>
</html>
