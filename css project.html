<!DOCTYPE html>
<html>
<head>
    <title>My Shop</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            background-color: rgb(101, 46, 46);
            color: rgb(16, 1, 1);
            text-align: center;
            padding: 15px;
        }

        .product {
            border: 1px solid black;
            width: 200px;
            padding: 15px;
            margin: 20px; 
            text-align: center;
        }

        button {
            background-color: rgb(249, 251, 249);
            color: rgb(4, 109, 246);
            padding: 8px;
        }
    </style>
</head>

<body>

    <h1>My E-Commerce Shop</h1>

    <div class="product">
        <h2>Mobile</h2>
        <p>Price: ₹20,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <h2>Laptop</h2>
        <p>Price: ₹50,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <h2>Headphones</h2>
        <p>Price: ₹2,000</p>
        <button>Add to Cart</button>
    </div>

</body>
</html>
