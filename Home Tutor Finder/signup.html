<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - Home Tutor Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand"><h1>🎓 Home Tutor Finder</h1></div>
      <nav><a href="index.html">Login</a></nav>
    </div>
  </header>
  <main>
    <div class="box">
      <h3>Create an Account</h3>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <select id="role">
        <option value="student">Student (Find Tutors)</option>
        <option value="admin">Admin (Add Tutors)</option>
      </select>
      <button onclick="signup()">Sign Up</button>
    </div>
  </main>
  
  <script>
    function signup() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      const r = document.getElementById("role").value;

      if(!u || !p) return alert("Please fill all fields");

      // Get existing users from local storage or create empty array
      let users = JSON.parse(localStorage.getItem("users")) || [];
      
      // Check if user already exists
      if(users.some(user => user.username === u)) {
        return alert("Username already exists!");
      }

      // Save new user
      users.push({ username: u, password: p, role: r });
      localStorage.setItem("users", JSON.stringify(users));
      
      alert("Signup successful! Please login.");
      window.location.href = "index.html"; // Redirect to login
    }
  </script>
</body>
</html>
