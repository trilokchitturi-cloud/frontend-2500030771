<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student - Home Tutor Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand"><h1>🎓 Student Dashboard</h1></div>
      <nav><button onclick="logout()">Logout</button></nav>
    </div>
  </header>
  <main>
    <div class="box">
      <h3>Find a Tutor</h3>
      <div class="search-inputs">
        <input type="text" id="searchSubject" placeholder="Subject..." oninput="filterTutors()">
        <input type="text" id="searchCity" placeholder="City..." oninput="filterTutors()">
      </div>
    </div>
    <div id="tutorList"></div>
  </main>

  <script>
    // Security check: Make sure user is logged in
    const currentUser = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!currentUser || currentUser.role !== "student") {
      alert("Access Denied. Students only.");
      window.location.href = "index.html";
    }

    // Load tutors from local storage. If empty, provide some default ones.
    let tutors = JSON.parse(localStorage.getItem("tutorsList"));
    if (!tutors || tutors.length === 0) {
      tutors = [
        { name: "Mr. Charan", subject: "Math", city: "Hyderabad", rate: 600 },
        { name: "Ms. Priya", subject: "English", city: "Mumbai", rate: 500 }
      ];
      localStorage.setItem("tutorsList", JSON.stringify(tutors));
    }

    function showTutors(list) {
      const container = document.getElementById("tutorList");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = "<p>No tutors match your search criteria.</p>";
        return;
      }

      list.forEach(t => {
        container.innerHTML += `
          <div class="card">
            <h3>${t.name}</h3>
            <p><strong>Subject:</strong> ${t.subject}</p>
            <p><strong>City:</strong> ${t.city}</p>
            <p><strong>Rate:</strong> ₹${t.rate}/hr</p>
            <button onclick="alert('Booked session with ${t.name}!')">Book Tutor</button>
          </div>
        `;
      });
    }

    function filterTutors() {
      const subQuery = document.getElementById("searchSubject").value.toLowerCase();
      const cityQuery = document.getElementById("searchCity").value.toLowerCase();

      const filtered = tutors.filter(t => 
        t.subject.toLowerCase().includes(subQuery) && 
        t.city.toLowerCase().includes(cityQuery)
      );
      showTutors(filtered);
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }

    // Show all tutors on initial load
    showTutors(tutors);
  </script>
</body>
</html>
