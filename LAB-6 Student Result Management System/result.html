<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result System</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        input, button { padding: 8px; width: 100%; margin-top: 5px; }
        #result-display { margin-top: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Student Result System</h2>
    <form id="resultForm">
        <div class="form-group">
            <label>Student Name:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Math Marks (out of 100):</label>
            <input type="number" id="math" required max="100" min="0">
        </div>
        <div class="form-group">
            <label>Science Marks (out of 100):</label>
            <input type="number" id="science" required max="100" min="0">
        </div>
        <button type="button" onclick="calculateResult()">Calculate Result</button>
        <button type="reset" onclick="document.getElementById('result-display').innerHTML=''">Clear Form</button>
    </form>

    <div id="result-display"></div>

    <script src="result.js"></script>
</body>
</html>
